<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .todo-container { max-width: 700px; margin: 0 auto; padding-top: 2rem; }
        .todo-item { display: flex; align-items: center; justify-content: space-between; }
        .todo-item .title { flex: 1; margin: 0 1rem; }
        .badge-status { font-size: 0.75rem; }
        .alert-error { margin-top: 1rem; }
    </style>
</head>
<body>

<div class="container todo-container">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fas fa-list-check me-2"></i>TODO List</h4>
        </div>
        <div class="card-body">

            <!-- Форма добавления -->
            <form method="post" action="/add" class="mb-4">
                <div class="input-group">
                    <input type="text" name="title" class="form-control" placeholder="Новая задача..."
                           required minlength="2" maxlength="100">
                    <button class="btn btn-primary">
                        <i class="fas fa-plus me-1"></i> Добавить
                    </button>
                </div>
            </form>

            <!-- Ошибка -->
            <div th:if="${error}" class="alert alert-danger alert-error" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> <span th:text="${error}"></span>
            </div>

            <!-- Список задач -->
            <div th:if="${todos != null and !todos.empty}">
                <ul class="list-group list-group-flush">
                    <li th:each="todo : ${todos}" class="list-group-item todo-item">
                        <input type="checkbox" class="form-check-input me-3"
                               th:checked="${todo.completed}"
                               th:disabled="${todo.completed}">
                        <span class="title" th:text="${todo.title}">Задача</span>
                        <span th:if="${todo.completed}" class="badge bg-success badge-status me-3">Выполнено</span>
                        <a th:href="'/delete/' + ${todo.id}" class="btn btn-danger btn-sm"
                           onclick="return confirm('Удалить задачу?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Пустой список -->
            <div th:if="${todos == null or todos.empty}" class="text-center text-muted py-4">
                <i class="fas fa-clipboard-list fa-3x mb-3"></i>
                <p class="mb-0">Нет задач. Добавьте первую!</p>
            </div>

            <!-- Статистика -->
            <div th:if="${todos != null and !todos.empty}" class="mt-3 small text-muted">
                <span th:text="${todos.size()} + ' задач'">0 задач</span>
                <span th:if="${todos.![completed].stream().filter(b -> b).count() > 0}" class="ms-3">
                    <i class="fas fa-check-circle text-success me-1"></i>
                    <span th:text="${todos.![completed].stream().filter(b -> b).count() + ' выполнено'}">0 выполнено</span>
                </span>
            </div>
        </div>
    </div>

    <!-- Health / статус бекенда -->
    <div class="text-center mt-4 small text-muted">
        <i class="fas fa-circle text-success me-1" style="font-size: 0.5rem;"></i>
        Бекенд: <span th:text="${backend.url}">http://todo-backend:8080</span>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
